[project]
name = "pulse"
version = "0.1.0"
description = "Groww Weekly Review Pulse"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "anthropic>=0.40",
    "mcp>=1.2",
    "google-play-scraper>=1.2.7",
    "python-dotenv>=1.0",
    "scikit-learn>=1.9.1",
    "groq>=1.7.0",
]

[project.scripts]
pulse = "pulse.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pulse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
